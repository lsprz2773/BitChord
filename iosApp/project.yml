# XcodeGen spec for the iPhone app. The .xcodeproj is generated, not committed:
#   brew install xcodegen && cd iosApp && xcodegen generate
name: BitChord
options:
  bundleIdPrefix: com.music.bitchord
  deploymentTarget:
    iOS: "16.0"
targets:
  BitChord:
    type: application
    platform: iOS
    sources: [BitChord]
    info:
      path: BitChord/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Compose Multiplatform refuses to start without it (120 Hz on ProMotion screens).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios
        TARGETED_DEVICE_FAMILY: "1"
        # The Gradle phase below writes outside the sandbox Xcode 15+ puts scripts in.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../iosKit/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, BitChordKit]
    preBuildScripts:
      - name: Build BitChordKit
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :iosKit:embedAndSignAppleFrameworkForXcode
